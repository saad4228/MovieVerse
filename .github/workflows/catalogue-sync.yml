name: Catalogue sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import mode
        required: true
        default: full
        type: choice
        options:
          - full
          - trending
      run_id:
        description: Existing run UUID to resume (optional)
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 */6 * * *"

concurrency:
  group: movieverse-catalogue-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOVIEVERSE_URL: ${{ secrets.MOVIEVERSE_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 */6 * * *' && 'trending' || 'full') }}
      RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run external catalogue importer
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$SYNC_MODE" == "trending" ]]; then
            args+=(--trending)
          fi
          if [[ -n "${RUN_ID:-}" ]]; then
            args+=(--run-id "$RUN_ID")
          fi
          node --experimental-transform-types \
            --loader ./scripts/local-ts-loader.mjs \
            scripts/sync-catalogue-remote.mjs \
            "${args[@]}"
